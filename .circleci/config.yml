# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:22.0

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            cd backend
            npm install

      - run:
          name: Run tests
          command: |
            cd backend
            npm test

workflows:
  tests:
    jobs:
      - test
